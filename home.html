<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Hub| Login</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">


    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-base-200">

    <header>
        <nav>
            <div class="navbar bg-base-100 shadow-sm space-x-2 py-3.5">
                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                        <!-- image icon -->
                        <div class="w-10 rounded-full">
                            <img alt="Tailwind CSS Navbar component" src="./assets/github-logo.png" />
                        </div>
                    </div>
                </div>
                <!-- GitHub Issues Tracker -->
                <div class="flex-1">
                    <a class="btn btn-ghost text-xl">GitHub <span class="hidden sm:inline">Issues Tracker</span></a>
                </div>
                <!-- search tab -->
                <div class="flex gap-2">
                    <input id="issue-search-id" type="text" placeholder="Search"
                        class="input input-bordered w-24 md:w-auto" />
                </div>
                <div>
                    <button class="btn btn-primary">
                        + <span class="hidden sm:inline">New Issue</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <section>
        <div class="w-11/12 mx-auto bg-white mt-7 h-18 rounded-lg shadow-md flex items-center justify-between px-4">
            <div id="all-btn-class" class="flex gap-2 mt-2 items-center">
                <button onclick="allCards('btn-all')" id="btn-all" class="btn btn-outline">
                    All
                </button>
                <button onclick="allCards('btn-open')" id="btn-open" class="btn btn-outline">
                    Open
                </button>
                <button onclick="allCards('btn-closed')" id="btn-closed" class="btn btn-outline">
                    Closed
                </button>
            </div>
        </div>


        <div class="w-11/12 mt-2 mx-auto justify-between mb-4 px-4 items-center bg-white border-0 border-gray-400 shadow-md rounded-md">
    
            <div class="flex items-center justify-between mb-4 p-4 ">
                <div class="flex items-center gap-2.5">
                    <div>
                        <img src="./assets/Aperture.png" alt="" />
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">
                            <span id="total-issue-count">60</span>
                            <span class="hidden sm:inline">Issues</span>
                        </h1>
                        <p class="text-sm text-base-content/60">
                            <span class=" hidden sm:inline">Track and manage your project issues</span>
                        </p>
                    </div>
                </div>

                <div class="flex gap-2">
                    <span class="badge"><span class="text-green-700">●</span> Open</span>
                    <span class="badge"><span class="text-violet-700">●</span> Closed</span>
                </div>
            </div>
        </div>
    </section>

    <section   id="all-card-container" class="w-11/12 mx-auto grid grid-cols-1 md:grid-cols-4 gap-3 mb-10 ">
        
    </section>
    <section id="spinner" class="hidden">
        <div class="flex justify-center items-center">
            <span class="loading loading-infinity loading-xs"></span>
            <span class="loading loading-infinity loading-sm"></span>
            <span class="loading loading-infinity loading-md"></span>
            <span class="loading loading-infinity loading-lg"></span>
            <span class="loading loading-infinity loading-xl"></span>
        </div>
    </section>
    
    <script src="script/active-btn.js"></script>
    <script src="script/spinner.js"></script>
    <script src="script/countIssue.js"></script>
    <script src="script/allcard.js"></script>
    <script src="script/search.js"></script>
    
   

</body>

</html>
