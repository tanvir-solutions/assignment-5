<div class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow border-t-4 ${element.status === "
    open"? "border-green-700" :" border-violet-700"}">
    <div class="card-body">

        <div class="flex justify-between items-start mb-4">

            <div class="w-7 h-7 rounded-full bg-success/30 flex items-center justify-center">
                <img src="${element.status === " open" ? "./assets/Open-Status.png" : "./assets/Closed- Status.png"
                    } " alt="" srcset="">
            </div>
            <span
              class=" badge badge-error badge-lg text-error ${element.priority==="high" ? "bg-error/30" :
                    element.priority==="low" ? "bg-gray-200" : "bg-warning/30" } border-0
                    font-semibold">${element.priority}</span>
            </div>
        </div>
